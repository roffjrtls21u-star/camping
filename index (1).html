<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>캠핑 준비 & 기록</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#EDEAD9;
    --bg-alt:#E3DFC9;
    --surface:#FFFFFF;
    --pine:#1F3D31;
    --pine-light:#3A6B54;
    --pine-pale:#E4EBE4;
    --amber:#D98E3F;
    --amber-pale:#F7E4C6;
    --ember:#B5482A;
    --ember-pale:#F5DCD2;
    --ink:#26302B;
    --ink-muted:#6E7A6F;
    --line:#D8D3BC;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Noto Sans KR',sans-serif;
    min-height:100vh;
  }
  .display{font-family:'Gaegu',cursive;}
  #app{max-width:520px;margin:0 auto;min-height:100vh;background:var(--bg);position:relative;padding-bottom:40px;}

  .topbar{background:var(--pine);color:#F3EFDE;padding:18px 20px 22px;position:sticky;top:0;z-index:20;}
  .topbar-row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .topbar-title{font-family:'Gaegu',cursive;font-weight:700;font-size:24px;display:flex;align-items:center;gap:8px;}
  .back-btn{background:none;border:none;color:#F3EFDE;font-size:15px;cursor:pointer;display:flex;align-items:center;gap:4px;padding:4px 2px;}
  .flame-dot{width:9px;height:9px;border-radius:50%;background:var(--amber);display:inline-block;flex-shrink:0;}
  .user-chip{display:flex;align-items:center;gap:7px;font-size:12.5px;color:#DCE5DD;}
  .user-chip img{width:24px;height:24px;border-radius:50%;}
  .signout-btn{background:none;border:none;color:#DCE5DD;font-size:12px;cursor:pointer;text-decoration:underline;padding:0;}

  .home-wrap{padding:18px 16px 100px;}
  .section-label{font-size:12px;color:var(--ink-muted);letter-spacing:.04em;margin:6px 2px 10px;font-weight:500;}
  .trip-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 16px 14px;margin-bottom:12px;cursor:pointer;transition:border-color .15s;}
  .trip-card:active{border-color:var(--amber);}
  .trip-card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .trip-card-title{font-family:'Gaegu',cursive;font-weight:700;font-size:21px;color:var(--pine);}
  .trip-card-meta{font-size:12.5px;color:var(--ink-muted);margin-top:3px;}
  .trip-card-bottom{display:flex;align-items:center;gap:10px;margin-top:12px;}
  .mini-progress{flex:1;height:7px;background:var(--bg-alt);border-radius:5px;overflow:hidden;}
  .mini-progress-fill{height:100%;background:linear-gradient(90deg,var(--amber),#E8AE5F);border-radius:5px;}
  .mini-progress-label{font-size:11.5px;color:var(--ink-muted);white-space:nowrap;}
  .record-flag{font-size:11px;background:var(--pine-pale);color:var(--pine);padding:2px 8px;border-radius:20px;font-weight:500;}

  .empty-state{text-align:center;padding:60px 20px;color:var(--ink-muted);}
  .empty-state .display{font-size:22px;color:var(--pine);display:block;margin-bottom:8px;}
  .empty-state p{font-size:13.5px;line-height:1.6;margin:0 0 16px;}
  .seed-btn{background:var(--pine);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13.5px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}

  .fab{position:fixed;left:50%;transform:translateX(calc(-260px + 20px));bottom:22px;background:var(--amber);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:26px;box-shadow:0 4px 14px rgba(0,0,0,.18);cursor:pointer;z-index:30;display:flex;align-items:center;justify-content:center;}
  @media (max-width:559px){.fab{transform:none;right:20px;left:auto;}}

  .tabbar{display:flex;background:var(--pine);padding:0 16px;gap:4px;}
  .tab-btn{flex:1;background:none;border:none;color:#BFCBC0;padding:11px 4px 12px;font-size:14.5px;font-weight:500;cursor:pointer;border-bottom:3px solid transparent;font-family:'Noto Sans KR',sans-serif;}
  .tab-btn.active{color:#fff;border-bottom-color:var(--amber);}

  .content{padding:18px 16px 90px;}

  .progress-hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin-bottom:18px;}
  .progress-hero-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .progress-hero-top .display{font-size:18px;color:var(--pine);}
  .progress-hero-pct{font-size:20px;font-weight:700;color:var(--amber);}
  .campfire-bar{height:11px;background:var(--bg-alt);border-radius:8px;overflow:hidden;position:relative;}
  .campfire-bar-fill{height:100%;background:linear-gradient(90deg,#B5482A,var(--amber),#F0C171);border-radius:8px;transition:width .3s;}

  .category{margin-bottom:20px;}
  .category-head{display:flex;align-items:center;gap:8px;margin-bottom:8px;padding:0 2px;}
  .category-icon{font-size:17px;}
  .category-name{font-family:'Gaegu',cursive;font-weight:700;font-size:19px;color:var(--pine);flex:1;}
  .category-count{font-size:12px;color:var(--ink-muted);}

  .item-list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden;}
  .item-row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line);}
  .item-row:last-child{border-bottom:none;}
  .check-box{width:21px;height:21px;border-radius:6px;border:2px solid var(--line);flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;background:var(--surface);}
  .check-box.checked{background:var(--amber);border-color:var(--amber);color:#fff;font-size:13px;}
  .item-text-wrap{flex:1;min-width:0;}
  .item-text{font-size:14.5px;color:var(--ink);}
  .item-text.checked{color:var(--ink-muted);text-decoration:line-through;}
  .item-note{font-size:12px;color:var(--amber);margin-top:1px;}
  .item-note.checked{color:var(--ink-muted);}
  .item-del{background:none;border:none;color:var(--ink-muted);font-size:16px;cursor:pointer;padding:2px 4px;flex-shrink:0;}

  .add-row{display:flex;gap:6px;padding:10px 12px;background:var(--bg-alt);}
  .add-row input{flex:1;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13.5px;font-family:'Noto Sans KR',sans-serif;background:#fff;min-width:0;}
  .add-row input:focus{outline:none;border-color:var(--amber);}
  .add-row button{background:var(--pine);color:#fff;border:none;border-radius:8px;padding:0 14px;font-size:13px;cursor:pointer;white-space:nowrap;}

  .add-cat-btn{width:100%;background:none;border:1.5px dashed var(--line);border-radius:12px;padding:12px;color:var(--ink-muted);font-size:13.5px;cursor:pointer;margin-top:6px;}

  .meal-station{position:relative;padding-left:20px;margin-bottom:18px;}
  .meal-station::before{content:'';position:absolute;left:5px;top:22px;bottom:-18px;width:2px;background:var(--line);}
  .meal-station:last-child::before{display:none;}
  .meal-dot{position:absolute;left:0;top:4px;width:12px;height:12px;border-radius:50%;background:var(--ember);border:2px solid var(--surface);box-shadow:0 0 0 1px var(--ember);}
  .meal-label{font-family:'Gaegu',cursive;font-weight:700;font-size:17px;color:var(--ember);margin-bottom:6px;}

  .template-save-btn{width:100%;background:var(--pine-pale);color:var(--pine);border:none;border-radius:10px;padding:11px;font-size:13.5px;font-weight:500;cursor:pointer;margin:4px 0 22px;}

  .field-block{margin-bottom:18px;}
  .field-label{font-size:13px;color:var(--ink-muted);margin-bottom:7px;font-weight:500;}
  .weather-row{display:flex;gap:8px;}
  .weather-opt{flex:1;padding:10px 4px;border:1.5px solid var(--line);border-radius:10px;text-align:center;cursor:pointer;font-size:12.5px;color:var(--ink-muted);background:var(--surface);}
  .weather-opt.selected{border-color:var(--amber);background:var(--amber-pale);color:#8A5A1E;font-weight:500;}
  .weather-emoji{font-size:19px;display:block;margin-bottom:3px;}
  .star-row{display:flex;gap:6px;}
  .star-btn{background:none;border:none;font-size:26px;cursor:pointer;color:var(--line);padding:0;}
  .star-btn.filled{color:var(--amber);}
  textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:12px;font-size:14px;font-family:'Noto Sans KR',sans-serif;resize:vertical;min-height:110px;background:var(--surface);}
  textarea:focus{outline:none;border-color:var(--amber);}
  .save-record-btn{width:100%;background:var(--amber);color:#fff;border:none;border-radius:10px;padding:13px;font-size:14.5px;font-weight:500;cursor:pointer;margin-top:6px;}
  .record-saved-note{font-size:11.5px;color:var(--ink-muted);text-align:center;margin-top:8px;}

  .modal-overlay{position:fixed;inset:0;background:rgba(31,61,49,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .modal-sheet{background:var(--bg);width:100%;max-width:520px;border-radius:20px 20px 0 0;padding:22px 20px 26px;max-height:85vh;overflow-y:auto;}
  .modal-title{font-family:'Gaegu',cursive;font-weight:700;font-size:22px;color:var(--pine);margin-bottom:16px;}
  .modal-field{margin-bottom:14px;}
  .modal-field label{display:block;font-size:12.5px;color:var(--ink-muted);margin-bottom:6px;font-weight:500;}
  .modal-field input{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;font-size:14.5px;font-family:'Noto Sans KR',sans-serif;background:var(--surface);}
  .modal-field input:focus{outline:none;border-color:var(--amber);}
  .date-row{display:flex;gap:10px;}
  .date-row .modal-field{flex:1;}
  .modal-check-row{display:flex;align-items:center;gap:8px;margin:16px 0;font-size:13.5px;color:var(--ink);}
  .modal-btns{display:flex;gap:10px;margin-top:18px;}
  .modal-btns button{flex:1;border:none;border-radius:10px;padding:12px;font-size:14px;cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
  .btn-cancel{background:var(--bg-alt);color:var(--ink);}
  .btn-confirm{background:var(--amber);color:#fff;font-weight:500;}
  .btn-danger{background:var(--ember-pale);color:var(--ember);}

  .trip-detail-actions{display:flex;justify-content:flex-end;padding:10px 16px 0;}
  .icon-btn{background:none;border:none;color:var(--ink-muted);font-size:13px;cursor:pointer;padding:4px 6px;}

  .loading-msg{text-align:center;padding:60px 20px;color:var(--ink-muted);font-size:13.5px;}
  .error-msg{text-align:center;padding:16px 20px;color:var(--ember);font-size:13px;}

  .signin-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px;text-align:center;}
  .signin-wrap .display{font-size:30px;color:var(--pine);margin-bottom:6px;}
  .signin-wrap p{font-size:13.5px;color:var(--ink-muted);margin:0 0 26px;line-height:1.6;}
  .google-btn{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 22px;font-size:14.5px;font-weight:500;color:var(--ink);cursor:pointer;font-family:'Noto Sans KR',sans-serif;}
  .google-btn img{width:18px;height:18px;}

  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);}
</style>
</head>

};

function cloneTemplateChecked(tpl, checkedMap){
  var t = JSON.parse(JSON.stringify(tpl));
  t.categories.forEach(function(c){ c.id=uid(); c.items.forEach(function(it){ it.id=uid(); it.checked = checkedMap ? !!checkedMap[it.text] : false; }); });
  t.meals.forEach(function(m){ m.id=uid(); m.items.forEach(function(it){ it.id=uid(); it.checked = checkedMap ? !!checkedMap[it.text] : false; }); });
  return t;
}

function tripsCol(){ return collection(db, 'users', state.user.uid, 'trips'); }
function tripRef(id){ return doc(db, 'users', state.user.uid, 'trips', id); }
function templateRef(){ return doc(db, 'users', state.user.uid, 'meta', 'template'); }

async function persistTrip(){
  if(!state.currentTripId || !state.currentTrip) return;
  try{ await setDoc(tripRef(state.currentTripId), tripDocData(state.currentTrip)); }
  catch(e){ console.error(e); }
}
function tripDocData(t){
  return {
    title:t.title, location:t.location||'', start:t.start||'', end:t.end||'',
    createdAt:t.createdAt||Date.now(),
    checklist:t.checklist, record:t.record||{weather:'',rating:0,memo:'',updatedAt:null}
  };
}

async function loadTripOnce(id){
  try{
    var snap = await getDoc(tripRef(id));
    if(snap.exists()) return Object.assign({id:id}, snap.data());
  }catch(e){ console.error(e); }
  return {id:id, checklist:{categories:[],meals:[]}, record:{weather:'',rating:0,memo:'',updatedAt:null}};
}

function totalProgress(trip){
  var total=0, done=0;
  trip.checklist.categories.forEach(function(c){ c.items.forEach(function(i){ total++; if(i.checked) done++; }); });
  trip.checklist.meals.forEach(function(m){ m.items.forEach(function(i){ total++; if(i.checked) done++; }); });
  return {total:total, done:done, pct: total? Math.round(done/total*100) : 0};
}
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function fmtDateRange(t){
  if(!t.start && !t.end) return '날짜 미정';
  if(t.start && t.end) return t.start+' ~ '+t.end;
  return t.start || t.end;
}

onAuthStateChanged(auth, function(user){
  if(state.unsubTrips){ state.unsubTrips(); state.unsubTrips=null; }
  if(user){
    state.user = user;
    state.view = 'home';
    state.ready = true;
    subscribeTrips();
  } else {
    state.user = null;
    state.trips = [];
    state.ready = true;
    render();
  }
});

function subscribeTrips(){
  state.unsubTrips = onSnapshot(tripsCol(), function(snap){
    state.trips = snap.docs.map(function(d){ return Object.assign({id:d.id}, d.data()); });
    if(state.view==='home') render();
  }, function(err){
    console.error(err);
    state.authError = '데이터를 불러오지 못했어요. Firestore 보안 규칙과 프로젝트 설정을 확인해주세요.';
    render();
  });
  render();
}

async function doSignIn(){
  state.authError = null;
  try{ await signInWithPopup(auth, provider); }
  catch(e){ console.error(e); state.authError = '로그인에 실패했어요: '+(e.code||e.message); render(); }
}
async function doSignOut(){ await signOut(auth); }

function render(){
  var app = document.getElementById('app');
  if(!state.ready){ app.innerHTML = '<div class="loading-msg">불러오는 중...</div>'; return; }
  if(!state.user){ renderSignIn(app); return; }
  if(state.view==='home') renderHome(app);
  else renderTrip(app);
  if(state.modal) renderModal(app);
}

function renderSignIn(app){
  app.innerHTML =
    '<div class="signin-wrap">'+
      '<span class="display">🏕 캠핑 준비 &amp; 기록</span>'+
      '<p>구글 계정으로 로그인하면<br>캠핑 체크리스트와 기록이 저장돼요.</p>'+
      '<button class="google-btn" id="google-signin"><img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="">Google로 계속하기</button>'+
      (state.authError ? '<div class="error-msg">'+esc(state.authError)+'</div>' : '')+
    '</div>';
  document.getElementById('google-signin').addEventListener('click', doSignIn);
}

function renderHome(app){
  var cards = state.trips.slice().sort(function(a,b){ return (b.createdAt||0)-(a.createdAt||0); }).map(function(t){
    var p = totalProgress(t);
    var hasRecord = t.record && t.record.memo;
    return '<div class="trip-card" data-open="'+t.id+'">'+
      '<div class="trip-card-top"><div><div class="trip-card-title">'+esc(t.title)+'</div>'+
      '<div class="trip-card-meta">'+esc(t.location||'장소 미정')+' · '+esc(fmtDateRange(t))+'</div></div></div>'+
      '<div class="trip-card-bottom"><div class="mini-progress"><div class="mini-progress-fill" style="width:'+p.pct+'%"></div></div>'+
      '<span class="mini-progress-label">'+p.done+'/'+p.total+'</span>'+
      (hasRecord ? '<span class="record-flag">기록 완료</span>' : '')+'</div></div>';
  }).join('');

  var body = state.trips.length ? ('<div class="section-label">캠핑 목록</div>'+cards) :
    '<div class="empty-state"><span class="display">아직 등록된 캠핑이 없어요</span><p>오른쪽 아래 + 버튼으로 새 캠핑을 만들거나,<br>예시 체크리스트로 바로 시작해보세요.</p>'+
    '<button class="seed-btn" id="seed-btn">예시 캠핑 불러오기 (무창포)</button></div>';

  app.innerHTML =
    '<div class="topbar"><div class="topbar-row">'+
      '<div class="topbar-title"><span class="flame-dot"></span>캠핑 준비 &amp; 기록</div>'+
      '<div class="user-chip">'+(state.user.photoURL?'<img src="'+state.user.photoURL+'" alt="">':'')+
      '<span>'+esc(state.user.displayName||'')+'</span><button class="signout-btn" id="signout-btn">로그아웃</button></div>'+
    '</div></div>'+
    (state.authError ? '<div class="error-msg">'+esc(state.authError)+'</div>' : '')+
    '<div class="home-wrap">'+body+'</div>'+
    '<button class="fab" id="fab-new" aria-label="새 캠핑 추가">+</button>';

  document.querySelectorAll('.trip-card').forEach(function(el){
    el.addEventListener('click', function(){ openTrip(el.getAttribute('data-open')); });
  });
  document.getElementById('fab-new').addEventListener('click', function(){
    state.modal = {type:'new-trip', title:'', location:'', start:'', end:'', useTemplate:true};
    render();
  });
  document.getElementById('signout-btn').addEventListener('click', doSignOut);
  var seedBtn = document.getElementById('seed-btn');
  if(seedBtn) seedBtn.addEventListener('click', seedExample);
}

async function seedExample(){
  var id = uid();
  var checklist = cloneTemplateChecked(DEFAULT_TEMPLATE, SEED_CHECKED);
  var entry = {title:'무창포 캠핑', location:'무창포해수욕장', start:'', end:'', createdAt:Date.now(),
    checklist:checklist, record:{weather:'',rating:0,memo:'',updatedAt:null}};
  try{
    await setDoc(tripRef(id), entry);
    await setDoc(templateRef(), {categories:DEFAULT_TEMPLATE.categories, meals:DEFAULT_TEMPLATE.meals});
  }catch(e){ console.error(e); state.authError='예시 데이터를 만들지 못했어요: '+e.message; render(); }
}

async function openTrip(id){
  state.currentTripId = id;
  state.currentTrip = await loadTripOnce(id);
  state.view = 'trip';
  state.tripTab = 'checklist';
  render();
}
function tripMeta(){ return state.trips.find(function(t){ return t.id===state.currentTripId; }); }

function renderTrip(app){
  var meta = tripMeta();
  if(!meta){ state.view='home'; render(); return; }
  var trip = state.currentTrip;
  var p = totalProgress(trip);

  var html = '<div class="topbar"><div class="topbar-row"><button class="back-btn" id="back-home">← 목록</button></div>'+
    '<div class="topbar-title" style="margin-top:6px;">'+esc(meta.title)+'</div>'+
    '<div style="font-size:12.5px;color:#C7D2C9;margin-top:2px;">'+esc(meta.location||'장소 미정')+' · '+esc(fmtDateRange(meta))+'</div>'+
    '</div>'+
    '<div class="trip-detail-actions"><button class="icon-btn" id="edit-trip">여행 정보 수정</button>'+
    '<button class="icon-btn" id="del-trip">삭제</button></div>'+
    '<div class="tabbar">'+
      '<button class="tab-btn'+(state.tripTab==='checklist'?' active':'')+'" data-tab="checklist">준비물 체크리스트</button>'+
      '<button class="tab-btn'+(state.tripTab==='record'?' active':'')+'" data-tab="record">캠핑 기록</button>'+
    '</div><div class="content">';

  if(state.tripTab==='checklist'){
    html += '<div class="progress-hero"><div class="progress-hero-top"><span class="display">짐 챙기기</span><span class="progress-hero-pct">'+p.pct+'%</span></div>'+
      '<div class="campfire-bar"><div class="campfire-bar-fill" style="width:'+p.pct+'%"></div></div></div>';

    trip.checklist.categories.forEach(function(cat){
      var done = cat.items.filter(function(i){return i.checked;}).length;
      html += '<div class="category" data-cat="'+cat.id+'">'+
        '<div class="category-head"><span class="category-icon">'+esc(cat.icon||'🎒')+'</span><span class="category-name">'+esc(cat.name)+'</span><span class="category-count">'+done+'/'+cat.items.length+'</span></div>'+
        '<div class="item-list">'+cat.items.map(function(it){ return itemRowHtml(it, cat.id, null); }).join('')+
        '<div class="add-row"><input type="text" placeholder="항목 추가" data-add-item="'+cat.id+'"><button data-add-btn="'+cat.id+'">추가</button></div>'+
        '</div></div>';
    });
    html += '<button class="add-cat-btn" id="add-cat-btn">+ 새 카테고리 추가</button>';

    html += '<div class="section-label" style="margin-top:26px;">🍽 음식 타임라인</div>';
    trip.checklist.meals.forEach(function(meal){
      html += '<div class="meal-station"><span class="meal-dot"></span><div class="meal-label">'+esc(meal.label)+'</div>'+
        '<div class="item-list">'+meal.items.map(function(it){ return itemRowHtml(it, null, meal.id); }).join('')+
        '<div class="add-row"><input type="text" placeholder="메뉴 추가" data-add-meal-item="'+meal.id+'"><button data-add-meal-btn="'+meal.id+'">추가</button></div>'+
        '</div></div>';
    });
    html += '<button class="template-save-btn" id="save-template-btn">이 목록을 다음 캠핑 템플릿으로 저장</button>';
  } else {
    var r = trip.record || {weather:'',rating:0,memo:'',updatedAt:null};
    var weathers = [{key:'맑음',emoji:'☀️'},{key:'흐림',emoji:'☁️'},{key:'비',emoji:'🌧️'},{key:'바람',emoji:'🌬️'}];
    html += '<div class="field-block"><div class="field-label">날씨</div><div class="weather-row">'+
      weathers.map(function(w){ return '<div class="weather-opt'+(r.weather===w.key?' selected':'')+'" data-weather="'+w.key+'"><span class="weather-emoji">'+w.emoji+'</span>'+w.key+'</div>'; }).join('')+'</div></div>';
    html += '<div class="field-block"><div class="field-label">캠핑 만족도</div><div class="star-row">'+
      [1,2,3,4,5].map(function(n){ return '<button class="star-btn'+(n<=r.rating?' filled':'')+'" data-star="'+n+'">★</button>'; }).join('')+'</div></div>';
    html += '<div class="field-block"><div class="field-label">메모</div><textarea id="record-memo" placeholder="이번 캠핑에서 있었던 일, 아이들 반응, 다음에 바꾸고 싶은 점을 적어보세요.">'+esc(r.memo)+'</textarea></div>';
    html += '<button class="save-record-btn" id="save-record-btn">기록 저장</button>';
    if(r.updatedAt) html += '<div class="record-saved-note">마지막 저장: '+new Date(r.updatedAt).toLocaleString('ko-KR')+'</div>';
  }
  html += '</div>';
  app.innerHTML = html;
  bindTripEvents();
}

function itemRowHtml(it, catId, mealId){
  return '<div class="item-row"><div class="check-box'+(it.checked?' checked':'')+'" data-item-id="'+it.id+'" data-cat-id="'+(catId||'')+'" data-meal-id="'+(mealId||'')+'">'+(it.checked?'✓':'')+'</div>'+
    '<div class="item-text-wrap"><div class="item-text'+(it.checked?' checked':'')+'">'+esc(it.text)+'</div>'+
    (it.note ? '<div class="item-note'+(it.checked?' checked':'')+'">'+esc(it.note)+'</div>' : '')+'</div>'+
    '<button class="item-del" data-del-id="'+it.id+'" data-del-cat="'+(catId||'')+'" data-del-meal="'+(mealId||'')+'" aria-label="삭제">×</button></div>';
}
function findList(catId, mealId){
  if(catId){ var c = state.currentTrip.checklist.categories.find(function(x){return x.id===catId;}); return c?c.items:null; }
  if(mealId){ var m = state.currentTrip.checklist.meals.find(function(x){return x.id===mealId;}); return m?m.items:null; }
  return null;
}

function bindTripEvents(){
  var back = document.getElementById('back-home');
  if(back) back.addEventListener('click', function(){ state.view='home'; render(); });
  var editBtn = document.getElementById('edit-trip');
  if(editBtn) editBtn.addEventListener('click', function(){
    var m = tripMeta();
    state.modal = {type:'edit-trip', title:m.title, location:m.location, start:m.start, end:m.end};
    render();
  });
  var delBtn = document.getElementById('del-trip');
  if(delBtn) delBtn.addEventListener('click', function(){ state.modal = {type:'confirm-delete'}; render(); });

  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.addEventListener('click', function(){ state.tripTab = b.getAttribute('data-tab'); render(); });
  });
  document.querySelectorAll('.check-box').forEach(function(b){
    b.addEventListener('click', function(){
      var list = findList(b.getAttribute('data-cat-id')||null, b.getAttribute('data-meal-id')||null);
      if(!list) return;
      var item = list.find(function(i){return i.id===b.getAttribute('data-item-id');});
      if(item){ item.checked = !item.checked; persistTrip(); render(); }
    });
  });
  document.querySelectorAll('.item-del').forEach(function(b){
    b.addEventListener('click', function(){
      var list = findList(b.getAttribute('data-del-cat')||null, b.getAttribute('data-del-meal')||null);
      if(!list) return;
      var idx = list.findIndex(function(i){return i.id===b.getAttribute('data-del-id');});
      if(idx>-1){ list.splice(idx,1); persistTrip(); render(); }
    });
  });
  document.querySelectorAll('[data-add-btn]').forEach(function(b){ b.addEventListener('click', function(){ addItemFromInput(b.getAttribute('data-add-btn'), null); }); });
  document.querySelectorAll('[data-add-item]').forEach(function(inp){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter') addItemFromInput(inp.getAttribute('data-add-item'), null); }); });
  document.querySelectorAll('[data-add-meal-btn]').forEach(function(b){ b.addEventListener('click', function(){ addItemFromInput(null, b.getAttribute('data-add-meal-btn')); }); });
  document.querySelectorAll('[data-add-meal-item]').forEach(function(inp){ inp.addEventListener('keydown', function(e){ if(e.key==='Enter') addItemFromInput(null, inp.getAttribute('data-add-meal-item')); }); });

  var addCatBtn = document.getElementById('add-cat-btn');
  if(addCatBtn) addCatBtn.addEventListener('click', function(){ state.modal = {type:'new-category', name:''}; render(); });

  var saveTplBtn = document.getElementById('save-template-btn');
  if(saveTplBtn) saveTplBtn.addEventListener('click', async function(){
    var tpl = {categories: JSON.parse(JSON.stringify(state.currentTrip.checklist.categories)), meals: JSON.parse(JSON.stringify(state.currentTrip.checklist.meals))};
    tpl.categories.forEach(function(c){ c.items.forEach(function(i){ i.checked=false; }); });
    tpl.meals.forEach(function(m){ m.items.forEach(function(i){ i.checked=false; }); });
    try{ await setDoc(templateRef(), tpl); saveTplBtn.textContent='템플릿으로 저장했어요 ✓'; }
    catch(e){ saveTplBtn.textContent='저장에 실패했어요'; }
    setTimeout(function(){ saveTplBtn.textContent='이 목록을 다음 캠핑 템플릿으로 저장'; }, 1800);
  });

  document.querySelectorAll('.weather-opt').forEach(function(w){
    w.addEventListener('click', function(){
      state.currentTrip.record = state.currentTrip.record || {weather:'',rating:0,memo:'',updatedAt:null};
      state.currentTrip.record.weather = w.getAttribute('data-weather');
      persistTrip(); render();
    });
  });
  document.querySelectorAll('.star-btn').forEach(function(s){
    s.addEventListener('click', function(){
      state.currentTrip.record = state.currentTrip.record || {weather:'',rating:0,memo:'',updatedAt:null};
      state.currentTrip.record.rating = parseInt(s.getAttribute('data-star'),10);
      persistTrip(); render();
    });
  });
  var saveRecBtn = document.getElementById('save-record-btn');
  if(saveRecBtn) saveRecBtn.addEventListener('click', function(){
    var memo = document.getElementById('record-memo').value;
    state.currentTrip.record = state.currentTrip.record || {weather:'',rating:0,memo:'',updatedAt:null};
    state.currentTrip.record.memo = memo;
    state.currentTrip.record.updatedAt = Date.now();
    persistTrip(); render();
  });
}

function addItemFromInput(catId, mealId){
  var inp = catId ? document.querySelector('[data-add-item="'+catId+'"]') : document.querySelector('[data-add-meal-item="'+mealId+'"]');
  if(!inp) return;
  var val = inp.value.trim();
  if(!val) return;
  var list = findList(catId, mealId);
  if(!list) return;
  list.push({id:uid(), text:val, note:'', checked:false});
  persistTrip(); render();
}

function renderModal(app){
  var m = state.modal;
  var inner = '';
  if(m.type==='new-trip' || m.type==='edit-trip'){
    inner = '<div class="modal-title">'+(m.type==='new-trip'?'새 캠핑 추가':'여행 정보 수정')+'</div>'+
      '<div class="modal-field"><label>캠핑 이름</label><input id="mf-title" type="text" placeholder="예: 무창포 캠핑" value="'+esc(m.title)+'"></div>'+
      '<div class="modal-field"><label>장소</label><input id="mf-location" type="text" placeholder="예: 무창포해수욕장" value="'+esc(m.location)+'"></div>'+
      '<div class="date-row"><div class="modal-field"><label>시작일</label><input id="mf-start" type="date" value="'+esc(m.start)+'"></div>'+
      '<div class="modal-field"><label>종료일</label><input id="mf-end" type="date" value="'+esc(m.end)+'"></div></div>';
    if(m.type==='new-trip') inner += '<div class="modal-check-row"><input type="checkbox" id="mf-usetpl" '+(m.useTemplate?'checked':'')+'><label for="mf-usetpl">저장된 준비물 템플릿 불러오기</label></div>';
    inner += '<div class="modal-btns"><button class="btn-cancel" id="modal-cancel">취소</button><button class="btn-confirm" id="modal-confirm">'+(m.type==='new-trip'?'추가':'저장')+'</button></div>';
  } else if(m.type==='new-category'){
    inner = '<div class="modal-title">새 카테고리 추가</div><div class="modal-field"><label>카테고리 이름</label><input id="mf-catname" type="text" placeholder="예: 취사도구"></div>'+
      '<div class="modal-btns"><button class="btn-cancel" id="modal-cancel">취소</button><button class="btn-confirm" id="modal-confirm">추가</button></div>';
  } else if(m.type==='confirm-delete'){
    inner = '<div class="modal-title">캠핑을 삭제할까요?</div><div style="font-size:13.5px;color:var(--ink-muted);margin-bottom:6px;">체크리스트와 기록이 함께 삭제되며 되돌릴 수 없어요.</div>'+
      '<div class="modal-btns"><button class="btn-cancel" id="modal-cancel">취소</button><button class="btn-danger" id="modal-confirm">삭제</button></div>';
  }
  var overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = '<div class="modal-sheet">'+inner+'</div>';
  app.appendChild(overlay);
  overlay.addEventListener('click', function(e){ if(e.target===overlay){ state.modal=null; render(); } });
  var cancelBtn = document.getElementById('modal-cancel');
  if(cancelBtn) cancelBtn.addEventListener('click', function(){ state.modal=null; render(); });
  var confirmBtn = document.getElementById('modal-confirm');
  if(confirmBtn) confirmBtn.addEventListener('click', function(){ handleModalConfirm(); });
}

async function handleModalConfirm(){
  var m = state.modal;
  if(m.type==='new-trip'){
    var title = document.getElementById('mf-title').value.trim() || '이름 없는 캠핑';
    var location = document.getElementById('mf-location').value.trim();
    var start = document.getElementById('mf-start').value;
    var end = document.getElementById('mf-end').value;
    var useTpl = document.getElementById('mf-usetpl').checked;
    var checklist = {categories:[],meals:[]};
    if(useTpl){
      try{
        var snap = await getDoc(templateRef());
        var tpl = snap.exists() ? snap.data() : DEFAULT_TEMPLATE;
        checklist = cloneTemplateChecked({categories:tpl.categories, meals:tpl.meals}, null);
      }catch(e){ checklist = cloneTemplateChecked(DEFAULT_TEMPLATE, null); }
    }
    var id = uid();
    var entry = {title:title, location:location, start:start, end:end, createdAt:Date.now(),
      checklist:checklist, record:{weather:'',rating:0,memo:'',updatedAt:null}};
    try{ await setDoc(tripRef(id), entry); }catch(e){ console.error(e); }
    state.modal = null;
    await openTrip(id);
    return;
  }
  if(m.type==='edit-trip'){
    var meta = tripMeta();
    var patch = {
      title: document.getElementById('mf-title').value.trim() || meta.title,
      location: document.getElementById('mf-location').value.trim(),
      start: document.getElementById('mf-start').value,
      end: document.getElementById('mf-end').value
    };
    try{ await updateDoc(tripRef(meta.id), patch); }catch(e){ console.error(e); }
    if(state.currentTripId===meta.id){ Object.assign(state.currentTrip, patch); }
    state.modal = null; render();
    return;
  }
  if(m.type==='new-category'){
    var name = document.getElementById('mf-catname').value.trim();
    if(name){ state.currentTrip.checklist.categories.push({id:uid(), name:name, icon:'📦', items:[]}); await persistTrip(); }
    state.modal = null; render();
    return;
  }
  if(m.type==='confirm-delete'){
    var tid = state.currentTripId;
    try{ await deleteDoc(tripRef(tid)); }catch(e){ console.error(e); }
    state.modal = null; state.view='home'; state.currentTripId=null; state.currentTrip=null;
    render();
    return;
  }
}

render();
</script>
</body>
</html>
